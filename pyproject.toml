[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pp-flowhub"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "cryptography==46.0.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "openpyxl==3.1.5",
    "openai-agents==0.19.2",
]

[tool.setuptools.packages.find]
include = ["traveler_assistant*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
